<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futbolle | Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reinicio.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="encabezado-sitio">
<div class="contenido-encabezado">
<a href="index.html" class="logo">Futbolle</a>
<nav class="navegacion-principal">
<a href="index.html" class="enlace-nav">Jugar</a>
<a href="contacto.html" class="enlace-nav enlace-activo">Contacto</a>
<a href="https://github.com/nachoabranchuk/futbolle-proyecto" class="enlace-nav" id="enlace-github" target="_blank" rel="noopener">GitHub</a>
</nav>
<button type="button" class="boton-tema" id="boton-cambiar-tema" aria-label="Cambiar tema">🌙</button>
</div>
</header>
<main class="principal-contacto">
<h1 class="titulo-juego">Contacto</h1>
<p class="subtitulo-juego">¿Encontraste un error o querés dejar un comentario? Escribinos.</p>
<form class="formulario-contacto" id="formulario-contacto">
<div class="campo-contacto">
<label for="entrada-nombre-contacto">Nombre</label>
<input type="text" id="entrada-nombre-contacto" placeholder="Tu nombre">
<span class="error-campo" id="error-nombre-contacto"></span>
</div>
<div class="campo-contacto">
<label for="entrada-email-contacto">Email</label>
<input type="text" id="entrada-email-contacto" placeholder="tu@email.com">
<span class="error-campo" id="error-email-contacto"></span>
</div>
<div class="campo-contacto">
<label for="entrada-mensaje-contacto">Mensaje</label>
<textarea id="entrada-mensaje-contacto" placeholder="Escribí tu mensaje..."></textarea>
<span class="error-campo" id="error-mensaje-contacto"></span>
</div>
<button type="button" class="boton boton-primario" id="boton-enviar-contacto">Enviar mensaje</button>
</form>
</main>
<footer class="pie-sitio">
<p>Proyecto Final Individual - Desarrollo y Arquitecturas Web 2026 - UAI</p>
</footer>
<div class="fondo-modal oculto" id="fondo-modal-error">
<div class="caja-modal" id="caja-modal-error">
<h2 class="titulo-modal">Revisá el formulario</h2>
<p class="mensaje-modal" id="mensaje-modal-error"></p>
<button type="button" class="boton boton-primario" id="boton-cerrar-error">Cerrar</button>
</div>
</div>
<script src="js/contacto.js"></script>
</body>
</html>
